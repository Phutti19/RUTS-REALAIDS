services:
  caddy:
    build: ./caddy
    container_name: ruts-realaids-caddy
    restart: unless-stopped
    ports:
      - "4443:4443"
      - "4080:4080"
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    image: ruts-realaids-backend
    container_name: ruts-realaids-backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      PORT: 4000
      NODE_ENV: production
      TZ: ${TZ:-Asia/Bangkok}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SECURE: "true"
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}

  frontend:
    image: ruts-realaids-frontend
    container_name: ruts-realaids-frontend
    restart: unless-stopped
    expose:
      - "4002"
    environment:
      PORT: "4002"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_MAP_CENTER_LAT: ${NEXT_PUBLIC_MAP_CENTER_LAT:-7.1907}
      NEXT_PUBLIC_MAP_CENTER_LNG: ${NEXT_PUBLIC_MAP_CENTER_LNG:-100.5930}
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
